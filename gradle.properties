org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official

# ——— 下面两处是本机 JDK 位置，换机器要改 ———

# jvmToolchain(21) 用哪个 JDK。留空也行，Gradle 会自己从 JAVA_HOME、PATH 和常见安装位置找；
# 找不到 JDK 21 才会因为工具链缺失而报错。
org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr

# 打包用的完整 JDK，必须有 jpackage.exe（Android Studio 自带的 JBR 是精简运行时，没有它）。
tailcat.packaging.javaHome=C:/Program Files/Java/jdk-25
