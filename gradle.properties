org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official

# 本项目所在路径含中文（...\魔改apk\tailcat-tool），AGP 默认拒绝配置。
# Windows 桌面端完全不受影响；仅 Android target 需要这个开关。
# 若后续 Android 端出现 aapt2/d8 的诡异失败，把项目移到纯 ASCII 路径即可根治。
android.overridePathCheck=true

# android-shell 用了 Jetpack Compose / AndroidX
android.useAndroidX=true

# 本机 JDK 位置：打包与 jvmToolchain(21) 统一用 Android Studio 自带的 JBR 21
# （系统 JDK 是 25，比 Compose 插件已验证的范围更新，故显式排除）
org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr

# 打包用的完整 JDK（需要 jpackage.exe）。若换机器请改这里。
tailcat.packaging.javaHome=C:/Program Files/Java/jdk-25
